- name: Deploy application
  hosts: app
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/devops-demo
        state: directory
        owner: roman
        group: roman
        mode: "0755"

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: /opt/devops-demo/docker-compose.yml
        owner: roman
        group: roman
        mode: "0644"

    - name: Copy database initialization script
      ansible.builtin.copy:
        src: ../init.sql
        dest: /opt/devops-demo/init.sql
        owner: roman
        group: roman
        mode: "0644"

    - name: Pull application images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /opt/devops-demo

    - name: Start application stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/devops-demo
